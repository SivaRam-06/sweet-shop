{% extends "admin/base_admin.html" %}
{% block admin_content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
  <h1>Categories</h1>
  <a href="{{ url_for('admin.category_add') }}" class="btn btn-primary">+ Add Category</a>
</div>
<table class="admin-table">
  <thead><tr><th>Name</th><th>Slug</th><th>Products</th><th>Status</th><th>Actions</th></tr></thead>
  <tbody>
    {% for cat in categories %}
    <tr>
      <td>{{ cat.name }}</td>
      <td>{{ cat.slug }}</td>
      <td>{{ cat.products.count() }}</td>
      <td>{% if cat.is_active %}<span class="badge badge-success">Active</span>{% else %}<span class="badge badge-danger">Inactive</span>{% endif %}</td>
      <td><a href="{{ url_for('admin.category_edit', cat_id=cat.id) }}" class="btn btn-sm btn-outline">Edit</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
